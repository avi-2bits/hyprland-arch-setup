# --- Foot Terminal Configuration ---

[main]
term=foot
include=/home/avi/.config/hypr/themes/active/foot-colors.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=11,Noto Color Emoji:size=11
font-bold=JetBrainsMono Nerd Font:size=11:weight=bold
font-italic=JetBrainsMono Nerd Font:size=11:slant=italic
pad=12x12 center
initial-color-theme=dark
shell=/bin/zsh

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[url]
launch=xdg-open ${url}

