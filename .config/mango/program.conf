# Key Binds for Program and Scripts 
# mod keys name: super,ctrl,alt,shift,none
exec=awww-daemon

# menu and terminal
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot

# program
bind=Super,w,spawn,librewolf

# system stuff
bind=SUPER+SHIFT,n,spawn,foot nmtui
bind=SUPER+SHIFT,b,spawn,foot bluetui

# Scripts
# powermenu
bind=SUPER,Escape,spawn,~/.config/scripts/rofi-power.sh


# Super + F11: Select area to screenshot and save/copy
bind=SUPER,F11,spawn,~/.local/bin/screenshot area
# Super + Shift + F11: Fullscreen screenshot
bind=SUPER+ALT,F11,spawn,~/.local/bin/screenshot screen
# Super + Ctrl + F11: Quick area copy to clipboard only (no file saved)
bind=SUPER+CTRL,F11,spawn,~/.local/bin/screenshot copy-area
