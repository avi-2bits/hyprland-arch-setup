# --- Clean & Beautiful Terminal Output ---
msg-level=all=warn,ytdl_hook=error
term-playing-msg="▶ Playing: ${media-title}"
term-osd-bar=yes
term-osd-bar-chars="[━━ ]"
title="${media-title}"

# --- YouTube & Anti-403 Configuration ---
# 1. Point to your LibreWolf profile
#ytdl-raw-options=cookies-from-browser=firefox:/home/avi/.config/librewolf/librewolf/306cwwo8.default# 2. Use mweb/web client and IPv4 to avoid GoogleVideo blocks
#ytdl-raw-options-append=extractor-args="youtube:player_client=mweb,web"
#ytdl-raw-options-append=force-ipv4=

# --- Cache (Smooth Pipe Playback) ---
cache=yes
demuxer-max-bytes=100M
demuxer-max-back-bytes=50M
