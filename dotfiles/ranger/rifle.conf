# vim: ft=cfg
#
# rifle.conf - a minimalist approach
#
# Order matters. Rules are tested from top to bottom.


# -- Editor
mime ^text,  label editor = nvim -- "$@"
!mime ^text, label editor, ext xml|json|csv|tex|py|pl|rb|js|sh|php|conf|ini|service = nvim -- "$@"


# -- Web Browser
ext x?html?, has librewolf, X, flag f = librewolf -- "$@"
ext x?html?, has w3m, terminal = w3m "$@"
ext x?html?, has lynx, terminal = lynx -- "$@"


# -- PDF & Documents
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext epub, has zathura, X, flag f = zathura -- "$@"
ext djvu, has zathura, X, flag f = zathura -- "$@"
ext cb[rz], has zathura, X, flag f = zathura -- "$@"
ext docx?|pptx?|xlsx?, has libreoffice, X, flag f = libreoffice "$@"


# -- Video & Audio
mime ^video, has mpv, X, flag f = mpv -- "$@"
mime ^audio, has mpv, X, flag f = mpv -- "$@"


# -- Images
# Use nsxiv (modern fork) if available, otherwise sxiv
mime ^image, has nsxiv, X, flag f = nsxiv -bt -- "$@"
mime ^image, has sxiv, X, flag f = sxiv -bt -- "$@"
mime ^image, has feh,  X, flag f = feh -- "$@"
ext xcf, has gimp, X, flag f = gimp -- "$@"


# -- Archives
ext 7z|ace|ar|arc|bz2?|cab|cpio|deb|gz|jar|rar|tar|tgz|xz|zip, has atool = atool --list --each -- "$@" | "$PAGER"
ext 7z|ace|ar|arc|bz2?|cab|cpio|deb|gz|jar|rar|tar|tgz|xz|zip, has atool = atool --extract --each -- "$@"


# -- Scripts
ext py = python -- "$1"
ext sh = sh -- "$1"


# -- Terminal
# Use foot as the terminal for the `t` flag
mime ^ranger/x-terminal-emulator, has foot = foot -e "$@"


# -- Fallbacks
label open, has xdg-open = xdg-open "$@"
!mime ^text, !ext xml|json|csv|tex|py|pl|rb|js|sh|php|conf|ini|service = ask
